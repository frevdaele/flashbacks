<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#13171f" />
  <title>Niet gevonden – Flashbacks</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap">
  <style>
    :root {
      --bg: #13171f;
      --text: #edede9;
      --muted: #96969c;
      --accent: #e48500;
      --accent-hover: #ffa23a;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
    }

    .code {
      margin: 0 0 8px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p { margin: 0 0 24px; color: var(--muted); }

    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    a:hover { color: var(--accent-hover); text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Deze pagina bestaat niet (meer)</h1>
    <p>Misschien is ze verloren gegaan, zoals zoveel op het oude web.</p>
    <a href="/">Naar alle flashbacks</a>
  </main>
</body>
</html>
